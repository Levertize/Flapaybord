<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlapayBord RTX — OVERKILL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    
    <div id="game-container">
        <!-- Three.js will inject its canvas here -->
        <div id="canvas-wrapper"></div>

        <!-- Menu Utama -->
        <div id="main-menu">
            <h1>FLAPAYBORD</h1>
            <p>3D HYPER-REALISTIC EDITION</p>
            
            <div class="skin-selector">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Milo" class="skin-btn selected" data-skin="skin1" alt="Cyan Neon">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Oreo" class="skin-btn" data-skin="skin2" alt="Gold Metal">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Bella" class="skin-btn" data-skin="skin3" alt="Crimson Glow">
            </div>

            <button id="start-btn">ENGAGE ENGINE</button>
        </div>

        <div id="ui-overlay">
            <div id="score-display">0</div>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
